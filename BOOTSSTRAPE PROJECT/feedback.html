
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Feedback</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-dark text-white">

    <div class="container d-flex justify-content-center align-items-center min-vh-100 py-4">

        <div class="card bg-black text-white border-secondary shadow p-4 w-100"
             style="max-width: 500px;">

            <h2 class="text-center mb-2">💬 Movie Feedback</h2>

            <p class="text-secondary text-center mb-4">
                Help us improve your movie exploration experience!
            </p>

            <form action="./submit.html" method="GET">

                <!-- Name -->
                <div class="mb-3">
                    <label for="name" class="form-label">Your Name</label>
                    <input type="text" id="name" name="name"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="Enter your name" required>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input type="email" id="email" name="email"
                           class="form-control bg-dark text-white border-secondary"
                           placeholder="Enter your email" required>
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label for="category" class="form-label">
                        Feedback Category
                    </label>

                    <select id="category" name="category"
                            class="form-select bg-dark text-white border-secondary"
                            required>
                        <option value="" disabled selected>
                            Select a category
                        </option>
                        <option value="ui">Website Design / Layout</option>
                        <option value="content">Movie Information Accuracy</option>
                        <option value="feature">Feature Request</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Star Rating -->
                <div class="mb-3">
                    <label class="form-label">
                        How would you rate your experience?
                    </label>

                    <div class="d-flex gap-2 fs-3">
                        <input type="radio" class="btn-check"
                               name="rating" id="star1" value="1">
                        <label class="btn btn-outline-warning"
                               for="star1">★</label>

                        <input type="radio" class="btn-check"
                               name="rating" id="star2" value="2">
                        <label class="btn btn-outline-warning"
                               for="star2">★</label>

                        <input type="radio" class="btn-check"
                               name="rating" id="star3" value="3">
                        <label class="btn btn-outline-warning"
                               for="star3">★</label>

                        <input type="radio" class="btn-check"
                               name="rating" id="star4" value="4">
                        <label class="btn btn-outline-warning"
                               for="star4">★</label>

                        <input type="radio" class="btn-check"
                               name="rating" id="star5" value="5" checked>
                        <label class="btn btn-outline-warning"
                               for="star5">★</label>
                    </div>
                </div>

                <!-- Feedback Message -->
                <div class="mb-4">
                    <label for="message" class="form-label">
                        Your Feedback
                    </label>

                    <textarea id="message" name="message" rows="4"
                              class="form-control bg-dark text-white border-secondary"
                              placeholder="Write your thoughts or suggestions..."
                              required></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="btn btn-success w-100 fw-bold">
                    Submit Feedback
                </button>

            </form>
        </div>
    </div>

</body>
</html>
