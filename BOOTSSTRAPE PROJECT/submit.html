
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Submitted - CineVoyage</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .success-box {
            background-color: #151515;
            border: 1px solid #292929;
            border-radius: 15px;
            padding: 40px 25px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .checkmark {
            width: 80px;
            height: 80px;
            background-color: #ff1744;
            color: white;
            border-radius: 50%;
            font-size: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
        }

        .pink {
            color: #ff1744;
        }

        .btn-pink {
            background-color: #ff1744;
            color: white;
            border: none;
            padding: 12px 25px;
            font-weight: bold;
        }

        .btn-pink:hover {
            background-color: #e60032;
            color: white;
        }
    </style>
</head>

<body>

    <div class="success-box">

        <div class="checkmark">&#10003;</div>

        <h1 class="fw-bold">Feedback <span class="pink">Submitted!</span></h1>

        <p class="text-secondary mt-3">
            Thank you for sharing your thoughts with CineVoyage.
        </p>

        <p>
            Your feedback has been submitted successfully.
            We appreciate your time and support!
        </p>

        <a href="index.html" class="btn btn-pink mt-3">
            Back to Home
        </a>

    </div>

</body>
</html>
