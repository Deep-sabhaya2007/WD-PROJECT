<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Netflix Homepage</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
        }

        .hero {
            min-height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)),
                url("./MovieMania\ Cinematic\ Premiere\ Banner.png") center/cover no-repeat;
        }

        .logo {
            color: #e50914;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: -2px;
        }

        .btn-netflix {
            background-color: #e50914;
            color: white;
            border: none;
            font-weight: bold;
        }

        .btn-netflix:hover {
            background-color: #c11119;
            color: white;
        }

        .hero-content {
            min-height: 75vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .hero-content h1 {
            font-size: clamp(2.3rem, 5vw, 4rem);
            font-weight: 800;
        }

        .email-input {
            background: rgba(20, 20, 20, 0.8);
            color: white;
            border: 1px solid #777;
            min-height: 58px;
        }

        .email-input::placeholder {
            color: #ddd;
        }

        .email-input:focus {
            background: rgba(20, 20, 20, 0.9);
            color: white;
            border-color: white;
            box-shadow: none;
        }

        @media (max-width: 576px) {
            .logo {
                font-size: 30px;
            }

            .hero-content h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>

<body>

    <div class="hero">

        <!-- Navbar -->
        <!-- <nav class="navbar navbar-dark">
            <div class="container">
                <a href="#" class="navbar-brand logo">Movie<span>Mania</span></a>

                <div class="d-flex gap-2">
                    <select class="form-select form-select-sm bg-dark text-white"
                            style="width: 115px;">
                        <option>English</option>
                        <option>Hindi</option>
                    </select>

                    <a href="#" class="btn btn-netflix px-3">
                        Sign In
                    </a>
                </div>
            </div>
        </nav> -->

        <!-- Main Section -->
        <section class="hero-content">
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-lg-9">

                        <h1 class="display-1">WELCOME<br>TO <br> MovieMania</h1>


                        <p class="mt-4 mb-3">
                            Ready to watch?click on Get started
                        </p>

                        <!-- Email Form -->
                        <form class="row g-2 justify-content-center" action="#" method="get">


                            <div class="col-12 col-md-auto">
                                <button type="submit" class="btn btn-netflix btn-lg px-4 w-100">
                                    Get Started ❯
                                </button>
                            </div>

                        </form>

                    </div>
                </div>
            </div>
        </section>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
