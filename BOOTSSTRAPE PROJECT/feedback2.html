
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineVoyage - Feedback</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #0b0b0b;
            color: white;
            font-family: Arial, sans-serif;
        }

        .navbar {
            border-bottom: 1px solid #292929;
        }

        .logo {
            color: #ff1744;
            font-weight: bold;
            font-size: 26px;
        }

        .feedback-box {
            background-color: #151515;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 30px;
            max-width: 600px;
            margin: 60px auto;
        }

        .pink {
            color: #ff1744;
        }

        .form-control, .form-select {
            background-color: #222;
            color: white;
            border: 1px solid #444;
        }

        .form-control:focus, .form-select:focus {
            background-color: #222;
            color: white;
            border-color: #ff1744;
            box-shadow: none;
        }

        .form-control::placeholder {
            color: #aaa;
        }

        .form-select option {
            background-color: #222;
            color: white;
        }

        .btn-pink {
            background-color: #ff1744;
            color: white;
            border: none;
        }

        .btn-pink:hover {
            background-color: #e60032;
            color: white;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-dark">
        <div class="container">
            <a class="navbar-brand logo" href="#">
                CINE<span class="text-white">VOYAGE</span>
            </a>

            <a href="index.html" class="btn btn-pink">
                Home
            </a>
        </div>
    </nav>

    <!-- Feedback Form -->
    <div class="container">
        <div class="feedback-box">

            <h2 class="text-center fw-bold">
                Share Your <span class="pink">Feedback</span>
            </h2>

            <p class="text-center text-secondary mb-4">
                Help us make your movie experience better!
            </p>

            <form id="feedbackForm">

                <div class="mb-3">
                    <label class="form-label">Your Name</label>
                    <input type="text" class="form-control"
                           placeholder="Enter your name" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email" class="form-control"
                           placeholder="Enter your email" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Rate Our Website</label>
                    <select class="form-select" required>
                        <option value="" selected disabled>
                            Select your rating
                        </option>
                        <option>Excellent - 5 Stars</option>
                        <option>Very Good - 4 Stars</option>
                        <option>Good - 3 Stars</option>
                        <option>Average - 2 Stars</option>
                        <option>Poor - 1 Star</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label class="form-label">Your Message</label>
                    <textarea class="form-control" rows="4"
                              placeholder="Write your feedback here..."
                              required></textarea>
                </div>

                <button type="submit"
                        class="btn btn-pink w-100 fw-bold">
                    Submit Feedback
                </button>

                <p id="success"
                   class="text-center pink mt-3 d-none">
                    Thank you for your feedback!
                </p>

            </form>
        </div>
    </div>


</body>
</html>
