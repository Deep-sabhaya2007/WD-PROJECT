<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
  <link rel="stylesheet" href="feedback.css">
</head>

<body>

    <div class="feedback-card">
        <h2>💬 Movie Feedback</h2>
        <p>Help us improve your movie exploration experience!</p>

        <form action="#" method="POST">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="category">Feedback Category</label>
                <select id="category" name="category" required>
                    <option value="" disabled selected>Select a category</option>
                    <option value="ui">Website Design / Layout</option>
                    <option value="content">Movie Information Accuracy</option>
                    <option value="feature">Feature Request</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>How would you rate your experience?</label>
                <div class="rating-group">
                    <label><input type="radio" name="rating" value="1"> 1★</label>
                    <label><input type="radio" name="rating" value="2"> 2★</label>
                    <label><input type="radio" name="rating" value="3"> 3★</label>
                    <label><input type="radio" name="rating" value="4"> 4★</label>
                    <label><input type="radio" name="rating" value="5" checked> 5★</label>
                </div>
            </div>

            <div class="form-group">
                <label for="message">Your Feedback</label>
                <textarea id="message" name="message" rows="4" placeholder="Write your thoughts or suggestions..."
                    required></textarea>
            </div>
            <!-- <button type="submit" class="submit-btn" link="./q.html">Submit Feedback</button> -->
            <a href="./submit.html">
                <button type="button" class="submit-btn" >Submit Feedback</button>
            </a>

        </form>
    </div>

</body>

</html>
